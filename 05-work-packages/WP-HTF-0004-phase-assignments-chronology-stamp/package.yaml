id: WP-HTF-0004
title: Phase assignments and chronology date-stamp — give the programme something that can be wrong
status: done
commitment: committed
scope: >
  ROADMAP item 3, raised in priority 2026-08-17. The phase schema landed that
  day (P0-P1 / F1-F4 with Walker's water-level axis / N1-N3), but no formation
  has been assigned to a phase and the chronology values inside it are not
  date-stamped as a recorded commitment.

  This is the programme's anti-degeneration move, and it is the one the
  appraisal's own criteria demand. The belt now carries reinterpretations of
  BOTH principal independent chronometers — radiometric ages as residuals, and
  rhythmites as rapid laminae — with ice-core layer counts flagged as a likely
  third. The appraisal lists "a moving target that's never pinned down is a
  programme that can't be wrong by construction" among its degeneration markers.
  Fixing the partition is what converts accumulated interpretive freedom back
  into a falsifiable commitment.

  Deliverable: formations assigned to phases WITH their evidence against the
  stated physical criteria, and the chronology values (creation-to-Fall gap,
  Flood duration, post-Flood duration) stamped with a date so later revisions
  are visible as revisions.
authority_boundary: >
  Assignments are drafted here with evidence; **JD ratifies the chronology
  partition as a belt commitment.** Date-stamping a value as committed is a
  belt commitment in exactly the sense rule 11 reserves to him. Drafting,
  evidence-gathering, and the assignment table proceed without re-asking;
  marking the partition ratified does not.
actions:
  - Select an initial formation set with real published descriptions, avoiding
    formations already used in constructing the schema (use-novelty, rule 12)
  - Assign each on both axes, citing the physical criterion satisfied
  - Record assignments in a form where a single unit can be moved without
    moving the schema, per the schema's own stated discipline
  - Date-stamp the three chronology values with their current justification
  - Log to the appraisal, distinguishing a schema revision from an assignment
    correction
verification: >
  Every assignment cites a specific physical criterion from the schema table
  and a specific published description, not a narrative placement. At least one
  formation is assigned where the evidence is genuinely awkward, and the
  awkwardness is recorded rather than smoothed — a schema that has never
  strained against a case has not been tested. The chronology values carry
  dates and a stated basis.
disposition: >
  CLOSED 2026-08-19 as PI-02 objective P1. Register landed at
  03-solutions-baseline/3.2-theory/stratigraphy/phase-assignments.md with six
  use-novel units (Tapeats, Coconino, Redwall nautiloid bed, Whopper Sand,
  Peoria Loess, Green River), each citing a named schema criterion and a
  published description. Chronology values date-stamped in stratigraphy/README.md
  with basis and revision conditions -- PROPOSED, pending JD's ratification,
  which the authority_boundary reserves to him.

  TWO GENUINE STRAINS RECORDED RATHER THAN SMOOTHED, which is what the
  verification clause demanded. (1) A5 Peoria Loess -- N2's ~700 yr commitment
  yields ~8-9 m at the highest reported mass accumulation rate, against sections
  exceeding 20 m. Open, not fatal, not resolved. (2) A6 Green River, the real
  product of the pass -- this programme's OWN family is split on it (Oard &
  Klevberg 2008 argue Flood; Austin, Brand, Whitmore, Wise, Whitmore & Garner
  argue post-Flood lake), and both camps agree about the rock while disagreeing
  about the phase. THE SCHEMA THEREFORE UNDER-DETERMINES THE UNIT. Recorded as a
  limitation rather than repaired by adding a criterion after seeing the case,
  which would violate rule 1.

  HONEST SOURCING STATE: only A2 (Coconino) rests on a retrieved open-access
  mainstream primary (Brand & Maithel 2021, Frontiers in Earth Science 9:723495,
  confidence HIGH). The other five rest on search summaries and are labelled
  MEDIUM or LOW. This is a first pass, not a sourced baseline. Four retrieval
  failures logged per rule 13, including creation.com at HTTP 403.

  NAMED RESIDUAL: A3 rests entirely on the creationist literature with no
  independent mainstream description of that bed retrieved -- rule 8 cuts both
  ways and this row does not yet satisfy it.
