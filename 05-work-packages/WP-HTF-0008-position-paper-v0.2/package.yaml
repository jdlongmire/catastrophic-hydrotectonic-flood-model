id: WP-HTF-0008
title: Position paper v0.2 — revise and publish a new Zenodo version
status: proposed
commitment: committed
scope: >
  Revise POSITION-PAPER.md to v0.2 and publish it as a new version of the
  existing Zenodo deposit, under the stable concept DOI 10.5281/zenodo.21972858.

  Why a new version rather than a metadata edit. The published record
  (10.5281/zenodo.21972859, state "done") does expose an "edit" link, so its
  metadata is editable in place — verified against the live record 2026-08-18.
  But files are locked on a published deposit, and the attached PDF carries the
  old title on its own first page. A metadata-only title edit would therefore
  leave a permanently citable record whose title disagrees with its own file.
  Zenodo's versioning is the mechanism built for exactly this.

  This package exists because the title alone does not justify a version, but
  the accumulated delta does. Thirty-six commits landed after v0.1 was
  published on 2026-08-16, and several of them bear directly on sections the
  paper states as open.
delta_since_v0_1: >
  What the published paper does not yet say, section by section. This list is
  the package's actual content; the title swap is the smallest item on it.

  TITLE — "The Global Hydrotectonic Flood Model" becomes "The Catastrophic
  Hydrotectonic Flood Model" (WP-HTF-0007, JD 2026-08-18). On the paper this is
  a swap, not the insertion it was everywhere else in the repo.

  Sec 3.2 (energy budget) — the partition now has computational backing it did
  not have at publication. energy_partition_bounds.py was written against an
  external objection ("reduce friction and you still have to deal with the car
  crash") with its pass/fail conditions declared before the run. The stopping
  term came out ~3 orders of magnitude below the friction term. This is the
  programme's first real computation and it strengthens a section the paper
  currently states on ported authority alone.

  Sec 3.4 + Sec 8 bullet 2 (velocity inconsistency) — a new internal constraint
  now bounds the dispute. Requiring bulk kinetic energy to stay inside the
  budget yields a hard ceiling of 27.7–38.6 m/s (F2), which independently
  refutes the disputed 30 m/s figure the paper reports without being able to
  adjudicate. This does not by itself close 3.4 — see the gating decision.

  Sec 6.2 (stratigraphic timing) — substantially outdated. The paper states the
  diachronous front t_C(x) "carries zero specified geometry or initiating
  location as of this writing." Since then the phase schema was adopted (two
  axes, each with physical criteria) and t_C(x) was reframed as a variable
  boundary that independently matches an existing camp in the four-way
  creationist boundary debate. The three "failed boundary searches" are now
  recorded as a mis-specified question rather than three failures.

  Sec 7 (discriminators) — the paper names six candidates. The repo now carries
  eight, including candidate 7 (PPLC signature) and candidate 8 (transverse
  drainage / water gaps, Lee 2019, Data in Brief 23:103650, 1,549 cases), the
  first anomaly-targeting candidate. The standing verdict is unchanged and must
  be restated as such: zero discriminators evaluated.

  Sec 8 (limitations) — gains a real unpaid cost the paper does not carry. The
  proposed K-Pg ichnofabric discriminator was checked before registration and
  killed: the boundary clay is cross-cut by Zoophycos and Chondrites
  (Rodríguez-Tovar & Uchman 2008; Alegret et al. 2015). Deep-tier Zoophycos is
  recorded in the repo as a cost rather than absorbed, and the paper should
  carry it too.
forcing_item: >
  WITHDRAWN 2026-08-19, JD-flagged. Retained per rule 6 rather than deleted.

  IT READ: "JD's commitment that Chicxulub is a swarm MEMBER places K-Pg inside
  the catastrophic interval. Section 6.2 as published rejects K-Pg as a boundary
  candidate. The published paper therefore contradicts the programme's own hard
  core as it now stands."

  THERE IS NO CONTRADICTION, on two independent grounds, and neither required
  new work to establish -- both were already in the repo when the item was
  written.

  (1) Sec 6.2 DOES NOT REJECT K-Pg. It sits under "Open Questions," reports the
  initial research's rejection, and then undercuts it: "That evidence is real.
  Whether it is correctly identified is a separate, live dispute in the
  literature that the initial research did not engage... The programme's
  position is accordingly that the case against the tested boundaries is WEAKER
  THAN THE INITIAL RESEARCH REPRESENTED IT TO BE, without this constituting a
  positive case for any one of them." The forcing item mischaracterised the
  section it was raised against.

  (2) THE FOUNDING TRANSCRIPT ALREADY SEPARATED THE TWO OBJECTS. research/
  GPT-hydrotectonic-flood-model.md carries a two-boundary formulation --
  Z_trigger =/= Z_inundation(x) -- and states: "Under this formulation
  Chicxulub, for example, could theoretically represent a trigger without
  requiring the K-Pg boundary everywhere to represent immediate global
  inundation." Chicxulub-as-swarm-member fixes where the TRIGGER sits; the K-Pg
  rejection was about whether that horizon is a GLOBAL SYNCHRONOUS INUNDATION
  boundary. Different objects. Under the diachronous t_C(x) adopted 2026-08-17
  there is no tension at all.

  WHY IT SURVIVED. Raised 2026-08-17 under the fixed-boundary framing, which the
  diachronous adoption superseded THE SAME DAY. Never withdrawn, and then
  repeated as a live blocker in later sessions without either the paper section
  or the transcript passage being re-read. Same failure class as the
  un-propagated rule-4a recalibration (see appraisal 2026-08-19): a superseded
  item stays live because nothing swept for it.

  NET EFFECT ON THIS PACKAGE: it is LESS BLOCKED than recorded. See
  gating_decision.
residual_defect_found_while_checking: >
  Sec 6.2 says "tested THREE candidate boundaries" and then names FOUR --
  "Cambrian onset, then Permian-Triassic, Triassic-Jurassic, and
  Cretaceous-Paleogene (K-Pg)" -- and concludes "all three as failing." Four
  named, "three" stated twice.

  NOT MERELY AN EDITING SLIP, and it bears on an open JD ruling. The word doing
  the work is "then": Cambrian onset, THEN the other three. The published paper
  already reads Cambrian as the starting position and the other three as the
  tested candidates -- which is exactly the "split" classification JD is
  weighing under rule 25 (Cambrian = F-e belt refutation; the other three =
  eliminative successes). The count error is the seam where that distinction was
  half-made and never carried through.

  If JD rules the split, Sec 6.2 needs the count fixed and the distinction made
  explicit. It does not need re-argument.
gating_decision: >
  REVISED 2026-08-19 after the forcing item was withdrawn. RECOMMENDED: gate
  v0.2 on WP-HTF-0003 (velocity reconciliation) ONLY; do NOT gate on
  WP-HTF-0004, -0005 or -0006, and no longer gate on the forcing item, which
  does not exist. WP-HTF-0003 has since landed (2026-08-18), so the recommended
  gate is DISCHARGED and this package is reachable now.

  ONE ITEM REMAINS OUTSTANDING BUT IS NOT A GATE: JD's rule-25 ruling on whether
  the Cambrian placement is an F-e belt refutation and the other three are
  eliminative successes (the "split"). That ruling changes HOW Sec 6.2 is
  written, not WHETHER v0.2 can proceed, and it is cheap to apply once made.

  PRIOR TEXT RETAINED BELOW per rule 6.

  Rationale. Sec 3.4's inconsistency is the paper's single most-cited weakness
  — it appears in 3.4, in Sec 8's second bullet, and the v0.1 submission
  checklist named it as the one thing to be deliberate about. WP-HTF-0003
  exists to produce one surviving velocity and detachment depth inside the F2
  ceiling. A v0.2 that closes it is a version with a substantive reason to
  exist; a v0.2 that does not is a title change with extras, spending a
  permanent version number on cosmetics.

  Against gating on the stretch packages: O5 (candidate 8) and O6 (heat
  removal) are explicitly stretch, committed only to a recorded attempt, not a
  result. Gating a publication on them would couple a permanent record to work
  that may honestly resolve as "not closed." O4 (chronology stamp) would
  improve Sec 6.2 further but 6.2 can be updated truthfully now.

  ALTERNATIVE, if JD wants the record consistent sooner: publish a minimal v0.2
  carrying the title, the computational results, the two new discriminators and
  the ichnofabric cost, leaving 3.4 open and clearly labelled. Honest, faster,
  and spends the version on less.
authority_boundary: >
  Drafting the v0.2 revision, regenerating the PDF, and staging the Zenodo draft
  proceed under this package. PUBLISHING DOES NOT. Minting a permanent version
  is JD's call to authorize explicitly, as it was for v0.1 — external
  publication is a hard-stop under morals.md and the /zenodo-publish skill
  stages a draft for review as a separate step from publishing by design.

  Does not authorize: altering a belt claim, an appraisal verdict, or a
  discriminator's failure condition in order to make the paper tidier. If the
  paper and the belt disagree, the belt is corrected first, in its own package,
  and the paper follows.

  Does not authorize resolving JD's rule-25 split ruling unilaterally, nor
  restating Sec 6.2's position on the tested boundaries beyond what the ruling
  settles. (The former "does not authorize resolving the forcing item"
  restriction is moot -- the forcing item was withdrawn 2026-08-19; there was
  never a contradiction to resolve.)
actions:
  - Fix Sec 6.2's three/four count error and make the Cambrian-vs-tested-three
    distinction explicit, per JD's rule-25 ruling once made
  - Carry the two-boundary formulation (Z_trigger =/= Z_inundation(x)) into
    Sec 6.2 explicitly, so no future reader reconstructs the withdrawn
    contradiction from the paper's own text
  - Land WP-HTF-0003 so Sec 3.4 and Sec 8 bullet 2 can close
  - Revise POSITION-PAPER.md — title, 3.2, 3.4, 6.2, 7, 8, abstract, and the
    status line; add a "Changes in this version" block naming each revision
  - Regenerate the PDF via pandoc/xelatex, following the recorded v0.1
    procedure in 00-program-methods/publishing/
  - Update ZENODO_METADATA.txt for v0.2, including the repository URL, which
    changed with the rename
  - Stage the new Zenodo version as a DRAFT via the concept DOI's newversion
    link; verify metadata and the uploaded file by GET before stopping
  - Stop. Present the staged draft to JD for the explicit publish decision
  - On publication, append an appraisal entry and update the citation ledger
verification: >
  The v0.2 PDF's own title page reads "Catastrophic," resolving the mismatch
  that motivated the package. Every claim the revision adds traces to a belt
  document or a dated dev-note, none to this session's conversation. The
  standing verdict is restated unchanged (unappraised, zero discriminators
  evaluated) — a revision that quietly upgrades the verdict without an
  evaluated discriminator would be exactly the degenerating move the appraisal
  exists to catch. Concept DOI 10.5281/zenodo.21972858 resolves to the new
  version; the v0.1 version DOI 10.5281/zenodo.21972859 still resolves to v0.1.
  No file under research/ is modified.
disposition: >
  open -- JD requested this package 2026-08-18. UNBLOCKED as of 2026-08-19: the
  forcing item was withdrawn (there was no contradiction) and WP-HTF-0003, the
  only recommended gate, landed 2026-08-18. PI-02 objective P3.

  Publishing remains a separate explicit JD authorization, not carried by this
  package.
