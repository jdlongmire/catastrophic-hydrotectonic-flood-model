id: WP-HTF-0005
title: Discriminator candidate 8 — evaluate transverse drainage against the Lee database
status: proposed
commitment: stretch
scope: >
  The only discriminator candidate not gated behind ROADMAP items 1-3, and
  therefore the programme's nearest reachable evaluation and its only route off
  "unappraised."

  Rule 12's use-novelty conditions are partly met and the gap is known. The
  sample is Lee (2019), Data in Brief 23:103650 — 1,549 transverse drainages
  >=100 m, ten classification attributes, five segments each with bearing,
  slope, gradient and depth. Retrieved and read; confidence HIGH. The
  concession lives in the companion Lee (2021), SSRN 3980591, which evaluates
  antecedence, superimposition, piracy and overflow. Its abstract, recovered
  2026-08-18 via Wayback Machine (confidence HIGH), states the field's causal
  mechanisms should be treated as "black box' systems whose outputs are
  discordant patterns, but whose inputs are not fully understood" and gives
  ~39% of the dataset as strong-possibility overflow origin. Full 52-page
  text remains blocked by a Cloudflare JS challenge, not a plain paywall —
  see resolution below. (The "major misconception about headward eroding
  streams" line previously cited here was a misattribution, corrected in
  discriminators.md 2026-08-18 to Larson et al. 2016, Annals of the AAG.)

  The sharpened test, from the finding that OVERFLOW is already an accepted
  mainstream mechanism: phase F4 does not propose an exotic process, it claims
  an accepted one operated globally and synchronously rather than locally and
  sporadically. So the question is what fraction of the 1,549 are overflow-type
  and whether they cluster as a regime.
authority_boundary: >
  Retrieval, parsing, analysis scripting, and reporting the result proceed
  without re-asking, **including a result that goes against the programme.**
  Registering candidate 8 as a live discriminator, or recording any appraisal
  verdict change, is JD's. The declared failure condition in
  03-prediction/discriminators.md is FROZEN and must not be edited by this
  package under any circumstances — rule 1.
actions:
  - Obtain Lee 2021 in full; escalate per rule 13 (open-access mirror, direct
    PDF path, author contact, institutional access) rather than settling for
    the abstract
  - Obtain and parse the Lee 2019 supplementary data (KMZ + Excel by continent)
  - Compute mechanism proportions and test for regime clustering
  - "Handle the named confound: gap bearing is structurally controlled, so raw
    bearing coherence is permitted by both accounts. Any bearing analysis uses
    structurally-detrended residuals — stated in advance so it cannot be skipped"
  - Land as a script under rules 14-20, co-located with the claim
verification: >
  The declared failure condition is evaluated as written, unedited, and the
  verdict recorded whichever way it falls. If Lee 2021 cannot be obtained, the
  package closes as BLOCKED with the access failures recorded per rule 13 —
  it does NOT close by substituting search summaries for the primary.
  A refutation closes this package successfully.
resolution: >
  Retrieval attempt run 2026-08-18 (partial, first action item only). Full
  escalation ladder worked: SSRN landing page and direct PDF-delivery URL
  both return a Cloudflare JS challenge (not a simple 403 -- no available
  fetch tool can solve it, since it requires executing JS and passing a bot
  check in a live browser). ResearchGate 403. No mirror, cached PDF,
  institutional repository copy, or author-hosted preprint found (checked
  CORE, Semantic Scholar, ORCID, Academia.edu, personal/faculty pages).
  Wayback Machine snapshot (2024-07-10, predates the Cloudflare gate)
  recovered the full abstract, HIGH confidence -- see discriminators.md
  candidate 8 for the quoted content. One citation error caught and fixed
  in the process: the "misconception about headward eroding streams" line
  belongs to Larson et al. 2016 (Annals of the AAG), not Lee 2021.
disposition: open — the programme's highest epistemic value. Abstract in
  hand (HIGH confidence); full 52-page text blocked on a Cloudflare
  challenge that needs a human browser session, not further automated
  retrieval. Lee 2019 supplementary-data parsing and the regime-clustering
  analysis (actions 2-5) not yet started.
